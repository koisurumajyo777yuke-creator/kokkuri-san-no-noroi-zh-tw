titleScreen.addEventListener("click", () => {

  titleScreen.classList.remove("active");

  warningScreen.classList.add("active");

});

document.getElementById("startButton").addEventListener("click", (event) => {

  event.stopPropagation();

  warningScreen.classList.remove("active");

  storyScreen.classList.add("active");

  currentScene = 0;

  showScene();

});

function showScene() {

  const scene = scenes[currentScene];

  storyImage.src = scene.image;

  storyText.textContent = scene.text;
storyText.style.color = "";

storyText.classList.remove("shake");
  if (scene.chime) {

    schoolChime.currentTime = 0;

    schoolChime.play().catch(() => {});
}
  if (scene.coinSound) {

    coinSlideSound.currentTime = 0;

    coinSlideSound.play().catch(() => {});

}
  if (scene.waterDrop) {

    waterDropSound.currentTime = 0;

    waterDropSound.play().catch(() => {});

}
if (scene.threeKnocks) {

    threeKnocksSound.currentTime = 0;

    threeKnocksSound.play().catch(() => {});

}
  if (scene.stairFootsteps) {

    stairFootstepsSound.currentTime = 0;

    stairFootstepsSound.play().catch(() => {});

}
  if (scene.scienceScrape) {

  scienceScrapeSound.currentTime = 0;

  scienceScrapeSound.play().catch(() => {});
}
 if (scene.boneClick) {

    boneClickSound.currentTime = 0;

    setTimeout(() => {

        boneClickSound.play().catch(() => {});

    }, 800);

}
  if (scene.pianoSound) {

    pianoSound.currentTime = 0;

    setTimeout(() => {

        pianoSound.play().catch(() => {});

    }, 500);

}
if (scene.fourCornersSound) {

    fourCornersSound.currentTime = 0;

    fourCornersSound.play().catch(() => {});

}



  if (scene.scaryNo) {

  storyText.style.color = "red";

  storyText.classList.add("shake");

}
}
storyScreen.addEventListener("click", () => {

    if (currentScene === scenes.length - 1) {

        doorUnlockSound.currentTime = 0;

        doorUnlockSound.play().catch(() => {});

        

    }

    if (currentScene < scenes.length - 1) {

        currentScene++;

        showScene();

    }

});
