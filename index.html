* {

body {

.screen {

@keyframes blink {

  0%,100% { opacity: 1; }

  50% { opacity: .35; }

}

#warningScreen {

  padding: 30px 22px;

  align-items: center;

  justify-content: center;

  text-align: center;

}

.warning-box {

  max-width: 600px;

  line-height: 1.9;

  font-size: 16px;

.warning-title {

  margin-bottom: 22px;

}

button {

  margin-top: 24px;

  padding: 14px 28px;

  border: 1px solid #aaa;

  border-radius: 4px;

  background: #111;

  color: #fff;

  font-size: 17px;

}

#storyScreen {

  flex-direction: column;

  justify-content: center;

  align-items: center;

}

#storyImage {

  width: 100%;

  height: 100%;

  object-fit: cover;

}

#textBox {

  position: absolute;

  left: 0;

  right: 0;

  bottom: 0;

  min-height: 25%;

  padding: 18px 20px 30px;

  background: rgba(0,0,0,.72);

  font-size: 17px;

  line-height: 1.7;

  white-space: pre-line;

}

#nextMark {

  position: absolute;

  right: 18px;

  bottom: 8px;

  font-size: 18px;

  animation: blink 1.2s infinite;

}
.shake {

  animation: shake 0.08s infinite;

}

@keyframes shake {

  0%   { transform: translate(0, 0); }

  25%  { transform: translate(-4px, 2px); }

  50%  { transform: translate(4px, -2px); }

  75%  { transform: translate(-3px, -2px); }

  100% { transform: translate(3px, 2px); }

}
</style>

document.getElementById("startButton").addEventListener("click", (event) => {

  storyScreen.classList.add("active");

});

function showScene() {

  const scene = scenes[currentScene];

  storyImage.src = scene.image;

  storyText.textContent = scene.text;
storyText.style.color = "";

storyText.classList.remove("shake");
  if (scene.chime) {

    schoolChime.currentTime = 0;

    schoolChime.play().catch(() => {});
}
  if (scene.coinSound) {

    coinSlideSound.currentTime = 0;

    coinSlideSound.play().catch(() => {});

}
  if (scene.waterDrop) {

    waterDropSound.currentTime = 0;
